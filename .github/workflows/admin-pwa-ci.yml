name: Admin PWA CI

on:
  pull_request:
    paths:
      - 'admin/**'
      - '.github/workflows/admin-pwa-ci.yml'
  push:
    branches:
      - 'feat/alaluz-admin-pwa'
    paths:
      - 'admin/**'
      - '.github/workflows/admin-pwa-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
